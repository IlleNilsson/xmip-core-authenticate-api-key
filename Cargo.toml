# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-authenticate-api-key"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-authenticate-api-key"
description = "Authenticate by API key: verifies a key against a key store, hashed at rest, with its owner and expiry. A xmip-core-authenticate technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md), and on no sibling (ADR-0050 section 6). The
# mechanism catalog is xmip-core's and the verdict is xmip-core-context's.
authenticate = { package = "xmip-core-authenticate", git = "https://github.com/IlleNilsson/xmip-core-authenticate", branch = "main" }
# identify for the names a claim carries across the gates (identify::evidence),
# declared once for the first gate that writes them and this one that reads.
identify = { package = "xmip-core-identify", git = "https://github.com/IlleNilsson/xmip-core-identify", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }

[dev-dependencies]
# The estate's hex, to spell a hash out in the tests.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
